version: 2

# Conservative config:
# - Each ecosystem opens at most 1 grouped PR per scan.
# - Major-version bumps are IGNORED — we'd rather opt-in to those manually
#   after reading the release notes than have Dependabot break the build.
# - Weekly cadence (Tuesday) so the inbox stays quiet.

updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]

  # Root pnpm workspace (catches every workspace package via pnpm workspaces)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      all-npm:
        patterns: ["*"]

  # Python — for ebb_ai
  - package-ecosystem: pip
    directory: "/packages/core-py"
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      all-pip:
        patterns: ["*"]
