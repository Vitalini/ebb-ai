name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: build + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        # pnpm version comes from package.json packageManager (v9.15.0).
        # Do not also set `version:` here — pnpm/action-setup@v6 errors
        # with ERR_PNPM_BAD_PM_VERSION on duplicates.
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # Force a fresh native rebuild — the runner's Node 20.x cache occasionally
      # serves a better-sqlite3 prebuild that doesn't match the runtime, causing
      # ERR_DLOPEN_FAILED on `import`. Rebuilding from source takes ~30s and
      # makes the tests deterministic across runner image rolls.
      - run: pnpm --filter "@ebb-ai/core" rebuild better-sqlite3
      - run: pnpm --filter "@ebb-ai/core" build
      - run: pnpm --filter "@ebb-ai/mcp" build
      - run: pnpm --filter "@ebb-ai/cli" build
      # The OpenClaw plugin targets Node 22+ — its delivery store uses the
      # node:sqlite builtin (22.5+) with no better-sqlite3 fallback — so its
      # build + tests run only on the 22 matrix leg.
      - if: matrix.node == '22'
        run: pnpm --filter "@vitalini/ebb" build
      # Typecheck every workspace package (tsc --noEmit). CI previously
      # gated build + tests only, so type regressions the emit-less build
      # tolerated could land; this closes that gap.
      - run: pnpm typecheck
      - run: pnpm --filter "@ebb-ai/core" test
      - run: pnpm --filter "@ebb-ai/mcp" test
      - run: pnpm --filter "@ebb-ai/cli" test
      # The OpenClaw plugin's 24 tests previously ran only via the local
      # root `pnpm test`, never in CI — gate them here (Node 22 only).
      - if: matrix.node == '22'
        run: pnpm --filter "@vitalini/ebb" test

  python:
    name: python (3.11 + 3.12)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: install ebb_ai
        working-directory: packages/core-py
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,anthropic,openai]"
      - name: pytest
        working-directory: packages/core-py
        run: pytest -q
      - name: ruff
        working-directory: packages/core-py
        run: ruff check .
