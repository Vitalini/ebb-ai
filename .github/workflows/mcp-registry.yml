name: Publish to MCP Registry

# Called by release.yml after npm is live; dispatch by hand to retry, on
# the release tag ref (any other ref fails the first check):
#   gh workflow run mcp-registry.yml --ref vX.Y.Z -f version=X.Y.Z
on:
  workflow_call:
    inputs:
      version:
        description: Version to publish (must match server.json)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (must match server.json)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC grants the io.github.tidegap/* namespace
      contents: read
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checks the pinned SHA-256 before extracting (release.yml verify runs it too).
      - name: Install mcp-publisher
        run: |
          ../../scripts/install-mcp-publisher.sh
          ./mcp-publisher --version

      - name: Check server.json version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Publish only from the release tag (release.yml runs on it too).
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "v${INPUT_VERSION}" ]; then
            echo "::error::publish only from tag v${INPUT_VERSION}; this run is on ${REF_TYPE} ${REF_NAME}"
            exit 1
          fi
          VERSION=$(jq -r '.version' server.json)
          PKG_VERSION=$(jq -r '.packages[0].version' server.json)
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::server.json version ($VERSION) differs from packages[0].version ($PKG_VERSION)"
            exit 1
          fi
          if [ "$VERSION" != "$INPUT_VERSION" ]; then
            echo "::error::server.json version ($VERSION) does not match input version ($INPUT_VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check the npm package exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # npm view can lag a fresh publish; retry for about 2 minutes.
          for attempt in 1 2 3 4 5 6 7 8; do
            MCP_NAME=$(npm view "@tidegap/mcp@${VERSION}" mcpName 2>/dev/null) && [ -n "$MCP_NAME" ] && break
            echo "attempt ${attempt}: @tidegap/mcp@${VERSION} not visible yet"
            sleep 15
          done
          echo "mcpName=${MCP_NAME}"
          [ "$MCP_NAME" = "$(jq -r '.name' server.json)" ] || { echo "::error::npm mcpName does not match server.json name"; exit 1; }

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

      - name: Read back from the registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          URL="https://registry.modelcontextprotocol.io/v0/servers?search=tidegap"
          {
            echo "### MCP Registry"
            echo "Published \`io.github.tidegap/tidegap\` ${VERSION}"
            echo "Search: ${URL}"
            echo '```json'
            curl -fsS "$URL" | jq -c '.servers[]? | {name: .server.name, version: .server.version}' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
