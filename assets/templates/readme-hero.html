<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>{{css}}
.frame {
  display: flex;
  align-items: center;
  gap: 72px;
  width: 1600px;
  height: 500px;
  padding: 56px 72px;
  border: 2px solid var(--rule);
}
.logo { flex: 0 0 auto; }
.logo svg { width: 336px; }
.figure { flex: 1 1 auto; }
.caption { margin-top: 18px; font-size: 28px; }
</style>
</head>
<body>
<div class="frame">
  <div class="logo">{{logo}}</div>
  <div class="figure">
    <div class="chart">{{chart}}</div>
    <p class="caption">{{caption}}</p>
  </div>
</div>
</body>
</html>
