[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ebb-ai"
version = "0.17.1"
description = "Renamed to tidegap. Install tidegap; this package only re-exports it and stops receiving updates."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Vitalii Borovyk" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 7 - Inactive",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = ["tidegap>=0.18,<0.19"]

[project.urls]
Homepage = "https://github.com/tidegap/tidegap"
Repository = "https://github.com/tidegap/tidegap"

[tool.hatch.build.targets.wheel]
packages = ["src/ebb_ai"]
