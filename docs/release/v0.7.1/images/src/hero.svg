<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0f1418" stroke-width="1"/>
    </pattern>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#07090c"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- decorative ebb wave bottom-right -->
  <path d="M 0 540 Q 200 500 400 540 T 800 540 T 1200 540 L 1200 630 L 0 630 Z"
        fill="url(#wave)" opacity="0.35"/>
  <path d="M 0 560 Q 200 525 400 560 T 800 560 T 1200 560"
        fill="none" stroke="#5eead4" stroke-width="2" stroke-opacity="0.6"/>

  <!-- brand row: ~ mark + ebb-ai wordmark + v0.7.1 badge -->
  <g transform="translate(80, 100)">
    <rect width="68" height="68" rx="14" fill="#5eead4"/>
    <text x="34" y="51" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="46" font-weight="800" text-anchor="middle" fill="#07090c">~</text>

    <text x="92" y="51" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#f5f7fa">ebb-ai</text>

    <g transform="translate(252, 18)">
      <rect width="184" height="36" rx="8" fill="none" stroke="#5eead4" stroke-width="1.5"/>
      <text x="92" y="25" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle" fill="#5eead4">v0.7.1 · Apache-2.0</text>
    </g>
  </g>

  <!-- headline -->
  <g transform="translate(80, 240)">
    <text font-family="Inter, system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" fill="#f5f7fa">
      <tspan x="0" y="0">Persistent queue.</tspan>
      <tspan x="0" y="80" fill="#5eead4">Full CRUD.</tspan>
    </text>
  </g>

  <!-- subtitle -->
  <text x="80" y="430" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#9ca8b3">
    Tasks now survive Claude Code restarts and are shared across MCP hosts.
  </text>
  <text x="80" y="464" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#9ca8b3">
    Eight slash commands cover the whole carbon-aware deferral loop.
  </text>

  <!-- stats pills -->
  <g transform="translate(80, 510)" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="16" font-weight="600">
    <g>
      <rect width="200" height="44" rx="8" fill="none" stroke="#5eead4" stroke-width="1.5"/>
      <text x="100" y="29" text-anchor="middle" fill="#5eead4">8 slash commands</text>
    </g>
    <g transform="translate(216, 0)">
      <rect width="220" height="44" rx="8" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="110" y="29" text-anchor="middle" fill="#f59e0b">SQLite persistence</text>
    </g>
    <g transform="translate(452, 0)">
      <rect width="220" height="44" rx="8" fill="none" stroke="#3b4654" stroke-width="1.5"/>
      <text x="110" y="29" text-anchor="middle" fill="#c8d2dd">10 host integrations</text>
    </g>
    <g transform="translate(688, 0)">
      <rect width="220" height="44" rx="8" fill="none" stroke="#3b4654" stroke-width="1.5"/>
      <text x="110" y="29" text-anchor="middle" fill="#c8d2dd">169 tests passing</text>
    </g>
  </g>

  <!-- footer URL -->
  <text x="80" y="595" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="16" font-weight="500" fill="#5eead4">
    github.com/Vitalini/ebb-ai · ebb-ai.com
  </text>
</svg>
