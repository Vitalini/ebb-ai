<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Ebb AI</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#view">Skip to tasks</a>
  <header class="top">
    <a class="brand" href="#/agenda" aria-label="Ebb AI, Agenda"><span class="brand-mark" aria-hidden="true"></span>Ebb AI</a>
    <nav class="tabs" aria-label="Views">
      <a href="#/agenda" id="nav-agenda" class="tab"><span class="tab-glyph" aria-hidden="true">&#9776;</span><span class="tab-label">Agenda</span></a>
      <a href="#/timeline" id="nav-timeline" class="tab"><span class="tab-glyph" aria-hidden="true">&#8767;</span><span class="tab-label">Timeline</span></a>
      <a href="#/journal" id="nav-journal" class="tab"><span class="tab-glyph" aria-hidden="true">&#10003;</span><span class="tab-label">Journal</span><span class="count" id="unread-count" hidden></span></a>
    </nav>
    <div class="top-end">
      <button type="button" class="pill dispatcher" id="dispatcher-pill" data-state="unknown"><span class="pill-dot" aria-hidden="true"></span><span id="dispatcher-text">Dispatcher</span></button>
      <button type="button" class="icon-btn" id="help-btn" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)">?</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div id="conn" class="conn" role="status" hidden>Disconnected, retrying&hellip;</div>
  <div id="drop-dock" class="drop-dock" aria-hidden="true" hidden></div>
  <main id="view" class="view" tabindex="-1" aria-live="off"></main>
  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>
  <div id="toasts" class="toasts"></div>
  <dialog id="dialog" class="dialog" aria-labelledby="dialog-title"></dialog>
</body>
</html>
